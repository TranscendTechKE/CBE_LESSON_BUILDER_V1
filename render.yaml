services:
  - type: web
    name: cbe-lesson-builder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: CBE Lesson Builder
      - key: DEBUG
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "50"